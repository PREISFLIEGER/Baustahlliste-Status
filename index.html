const enc=new TextEncoder(), dec=new TextDecoder();
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const $=id=>document.getElementById(id);
const norm=k=>String(k||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const lsGet=k=>{ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } };
const lsSet=(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
const today=()=>{ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const deDate=iso=>{ const [y,m,d]=iso.split("-"); return d+"."+m+"."+y; };
async function deriveKey(w,id){
  const base=await crypto.subtle.importKey("raw",enc.encode(w),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:enc.encode("bsl1:"+id),iterations:100000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
}
async function aesOpen(key,b64){ const u=b64d(b64); return dec.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u.slice(0,12)},key,u.slice(12))); }
function lock(kind,msg,info){
  const T={enter:["Bitte Lizenzschlüssel eingeben.","Den Schlüssel bekommst du von der Fa. PREISFLIEGER."],
   invalid:["Der Lizenzschlüssel ist nicht gültig.","Bitte genau so eingeben, wie du ihn erhalten hast."],
   gesperrt:["Dieser Schlüssel ist (noch) nicht freigeschaltet.","Wurde er gerade erst angelegt, bitte 2 Minuten warten und die Seite neu laden. Falls du ihn falsch eingegeben hast, gib ihn bitte erneut ein. Sonst melde dich bei der Fa. PREISFLIEGER."],
   abgelaufen:["Die Testzeit ist"+(info&&info.bis?" am "+deDate(info.bis):"")+" abgelaufen.","Bitte melde dich bei der Fa. PREISFLIEGER für eine Verlängerung."],
   off:["Die Testversion ist derzeit nicht verfügbar.",""],
   offline:["Keine Verbindung zum Lizenzserver.","Bitte mit dem Internet verbinden. Ohne Verbindung läuft die App bis zu "+GRACE_DAYS+" Tage weiter."],
   nocrypto:["Dieser Browser wird nicht unterstützt.","Bitte Chrome, Edge oder Safari in aktueller Version verwenden und die Seite über eine https-Adresse öffnen."],
   fehler:["Die App konnte nicht geladen werden.","Bitte Seite neu laden oder bei der Fa. PREISFLIEGER melden."]}[kind];
  $("lock").hidden=false; $("lkMsg").textContent=T[0]; $("lkExtra").textContent=(msg?msg+" ":"")+T[1];
  $("lkForm").hidden=!(kind==="enter"||kind==="invalid"||kind==="gesperrt"||kind==="abgelaufen"); $("lkSave").hidden=false;
}
function exportData(){
  let pr=[],tp=[]; try{ pr=JSON.parse(localStorage.getItem("baustahlliste.projekte.v1")||"[]"); }catch(e){} try{ tp=JSON.parse(localStorage.getItem("baustahlliste.vorlagen.v1")||"[]"); }catch(e){}
  pr=pr.filter(p=>p&&!p.sample);
  if(!pr.length&&!tp.length){ alert("Es sind keine eigenen Daten zum Sichern vorhanden."); return; }
  const blob=new Blob([JSON.stringify({format:"baustahlliste-sicherung",version:1,created:new Date().toISOString(),projects:pr,templates:tp},null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="Baustahlliste-Sicherung "+today()+".json"; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
}
async function fetchStatus(){ const r=await fetch(STATUS_URL+(STATUS_URL.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"}); if(!r.ok) throw new Error("http"); return r.json(); }
async function evaluate(status,key){
  const k=norm(key), id=k.slice(0,6), w=k.slice(6);
  if(status.an===false) return {bad:"off",msg:status.msg};
  const entry=status.kunden&&status.kunden[id];
  if(!entry) return {bad:k.length<10?"invalid":"gesperrt",msg:status.msg};
  let info; try{ info=JSON.parse(await aesOpen(await deriveKey(w,id),entry)); }catch(e){ return {bad:"invalid"}; }
  if(info.bis<today()) return {bad:"abgelaufen",msg:status.msg,info};
  return {info,status};
}
async function start(){
  if(!(window.crypto&&crypto.subtle)) return lock("nocrypto");
  const lic=lsGet(LSK); if(!lic||!lic.key) return lock("enter");
  let status=null;
  try{ status=await fetchStatus(); lsSet(LSC,{ts:Date.now(),status}); }
  catch(e){ const c=lsGet(LSC); if(c&&Date.now()-c.ts<GRACE_DAYS*864e5) status=c.status; else return lock("offline"); }
  const r=await evaluate(status,lic.key);
  if(r.bad) return lock(r.bad,r.msg,r.info);
  let pay; try{ const ck=await crypto.subtle.importKey("raw",b64d(JSON.parse(await aesOpen(await deriveKey(norm(lic.key).slice(6),norm(lic.key).slice(0,6)),status.kunden[norm(lic.key).slice(0,6)])).ck),"AES-GCM",false,["decrypt"]); pay=JSON.parse(await aesOpen(ck,PAYLOAD)); }
  catch(e){ return lock("fehler"); }
  window.__LIZ={name:r.info.name,bis:r.info.bis,msg:status.msg||""};
  $("lock").remove();
  const st=document.createElement("style"); st.textContent=pay.css; document.head.appendChild(st);
  document.body.insertAdjacentHTML("beforeend",pay.html);
  const sc=document.createElement("script"); sc.textContent=pay.js; document.body.appendChild(sc);
  setInterval(async()=>{ try{ const s=await fetchStatus(); lsSet(LSC,{ts:Date.now(),status:s}); const x=await evaluate(s,lic.key); if(x.bad) location.reload(); }catch(e){} },6*3600*1000);
}
$("lkGo").onclick=()=>{ const k=norm($("lkKey").value); if(k.length<20){ lock("invalid"); return; } lsSet(LSK,{key:k}); location.reload(); };
$("lkKey").addEventListener("keydown",e=>{ if(e.key==="Enter") $("lkGo").click(); });
$("lkSave").onclick=exportData;
start().catch(()=>lock("fehler"));
})();
