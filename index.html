  const PLANS=[{m:1,p:4.99,l:"1 Monat"},{m:3,p:14.22,l:"3 Monate"},{m:6,p:26.95,l:"6 Monate"},{m:12,p:47.90,l:"12 Monate"}];
  const eur=v=>v.toFixed(2).replace(".",",")+" €", MAIL="preisflieger@outlook.com";
  const css="#pfov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;z-index:99;padding:16px;overflow:auto;box-sizing:border-box}#pfov .pfc{background:#fff;color:#18202a;border-radius:12px;border-top:4px solid #f07c12;max-width:520px;width:100%;padding:20px;font:14px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;box-sizing:border-box}#pfov h2{margin:0 0 8px;color:#12294f}#pfov h3{margin:14px 0 4px;font-size:15px;color:#12294f}#pfov table{border-collapse:collapse;width:100%;margin:8px 0}#pfov td,#pfov th{border-bottom:1px solid #dfe4ea;padding:7px 4px;text-align:left}#pfov th{font-size:12px;color:#5d6977}#pfov .r{text-align:right}#pfov a.pfb,#pfov button.pfb{display:inline-block;font:inherit;border-radius:8px;padding:7px 12px;border:1px solid #12294f;background:#12294f;color:#fff;text-decoration:none;cursor:pointer}#pfov button.pfx{font:inherit;border-radius:8px;padding:7px 12px;border:1px solid #cfd6de;background:#fff;color:#18202a;cursor:pointer;margin-top:12px}#pfov small{color:#5d6977;display:block;margin-top:8px}#pfov ol,#pfov ul{padding-left:20px;margin:4px 0}@media (prefers-color-scheme:dark){#pfov .pfc{background:#171e26;color:#e6ebf0}#pfov h2,#pfov h3{color:#9db8ea}#pfov td,#pfov th{border-color:#2c3743}#pfov button.pfx{background:#0f141a;color:#e6ebf0;border-color:#2c3743}}";
  function open(html){ close(); if(!document.getElementById("pfcss")){ const s=document.createElement("style"); s.id="pfcss"; s.textContent=css; document.head.appendChild(s); }
    const w=document.createElement("div"); w.id="pfov"; w.innerHTML='<div class="pfc" role="dialog" aria-modal="true">'+html+'<button class="pfx" id="pfclose">Schließen</button></div>';
    w.addEventListener("click",e=>{ if(e.target===w) close(); }); document.body.appendChild(w); document.getElementById("pfclose").onclick=close; }
  function close(){ const o=document.getElementById("pfov"); if(o) o.remove(); }
  function mail(pl){ const sub=encodeURIComponent("Bestellung STAHLFLIEGER – Lizenz "+pl.l);
    const body=encodeURIComponent("Guten Tag,\n\nich bestelle die Lizenz für STAHLFLIEGER:\n\nLaufzeit: "+pl.l+"\nPreis: "+eur(pl.p)+" inkl. 20 % USt\n\nFirma / Name: \nRechnungsadresse: \nUID-Nummer (nur Firmen): \nE-Mail für die Rechnung: \n\nBitte senden Sie mir die Rechnung. Nach Zahlungseingang erhalte ich Lizenzschlüssel und App-Link.\n\nMit freundlichen Grüßen");
    return "mailto:"+MAIL+"?subject="+sub+"&body="+body; }
  function prices(){ const base=PLANS[0].p;
    open('<h2>Preise &amp; Lizenz</h2><p>STAHLFLIEGER – Baustahllisten, Auswertung, PDF und Excel. Je länger die Laufzeit, desto günstiger pro Monat.</p><table><tr><th>Laufzeit</th><th class="r">pro Monat</th><th class="r">Gesamt</th><th></th></tr>'+
      PLANS.map(p=>{ const pm=p.p/p.m, sv=base*p.m-p.p; return '<tr><td><b>'+p.l+'</b>'+(sv>0.005?'<br><small style="margin:0">Sie sparen '+eur(sv)+'</small>':'')+'</td><td class="r">'+eur(pm)+'</td><td class="r"><b>'+eur(p.p)+'</b></td><td class="r"><a class="pfb" href="'+mail(p)+'">Bestellen</a></td></tr>'; }).join("")+
      '</table><small>Alle Preise inkl. 20 % USt. „Bestellen“ öffnet eine fertige E-Mail an die Fa. PREISFLIEGER.</small><h3>So läuft es ab</h3><ol><li>Sie wählen die Laufzeit und senden die E-Mail ab.</li><li>Sie erhalten eine Rechnung als PDF.</li><li>Nach Zahlungseingang bekommen Sie Ihren Lizenzschlüssel und den App-Link.</li></ol><small>Verlängerung zum selben Preis. Ihre Daten bleiben bei einer Verlängerung erhalten.</small>'); }
  function install(){ open('<h2>App aufs Handy und PC</h2><p>Die App läuft im Browser. So legen Sie sie auf den Startbildschirm oder in die Favoriten:</p>'+
    '<h3>iPhone / iPad (Safari)</h3><ol><li>App-Link in <b>Safari</b> öffnen (nicht in Mail oder WhatsApp).</li><li>Unten auf <b>Teilen</b> tippen (Quadrat mit Pfeil).</li><li><b>Zum Home-Bildschirm</b> wählen und mit <b>Hinzufügen</b> bestätigen.</li></ol>'+
    '<h3>Android (Chrome)</h3><ol><li>App-Link in <b>Chrome</b> öffnen.</li><li>Oben rechts auf die <b>drei Punkte</b> tippen.</li><li><b>Zum Startbildschirm hinzufügen</b> (oder <b>App installieren</b>) wählen und bestätigen.</li></ol>'+
    '<h3>PC (Chrome, Edge, Firefox)</h3><ol><li>App-Link öffnen.</li><li>Mit <b>Strg + D</b> (Mac: <b>Cmd + D</b>) als Lesezeichen/Favorit speichern.</li></ol>'+
    '<small>Wichtig: Ihre Daten liegen nur in diesem Browser auf diesem Gerät. Bitte regelmäßig „Datensicherung → Sicherung speichern“ nutzen, besonders vor dem Löschen von Browserdaten.</small>'); }
  return {prices,install,close};
})();
</script>

const enc=new TextEncoder(), dec=new TextDecoder();
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const $=id=>document.getElementById(id);
const norm=k=>String(k||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const lsGet=k=>{ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } };
const lsSet=(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
const today=()=>{ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const deDate=iso=>{ const [y,m,d]=iso.split("-"); return d+"."+m+"."+y; };
async function deriveKey(w,id){
  const base=await crypto.subtle.importKey("raw",enc.encode(w),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:enc.encode("bsl1:"+id),iterations:100000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
}
async function aesOpen(key,b64){ const u=b64d(b64); return dec.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u.slice(0,12)},key,u.slice(12))); }
function lock(kind,msg,info){
  const T={enter:["Bitte Lizenzschlüssel eingeben.","Den Schlüssel bekommst du von der Fa. PREISFLIEGER."],
   invalid:["Der Lizenzschlüssel ist nicht gültig.","Bitte genau so eingeben, wie du ihn erhalten hast."],
   gesperrt:["Dieser Schlüssel ist (noch) nicht freigeschaltet.","Wurde er gerade erst angelegt, bitte 2 Minuten warten und die Seite neu laden. Falls du ihn falsch eingegeben hast, gib ihn bitte erneut ein. Sonst melde dich bei der Fa. PREISFLIEGER."],
   abgelaufen:[(info&&info.art==="lizenz"?"Die Lizenz ist":"Die Testzeit ist")+(info&&info.bis?" am "+deDate(info.bis):"")+" abgelaufen.","Bitte melde dich bei der Fa. PREISFLIEGER für eine Verlängerung."],
   off:["Die Testversion ist derzeit nicht verfügbar.",""],
   offline:["Keine Verbindung zum Lizenzserver.","Bitte mit dem Internet verbinden. Ohne Verbindung läuft die App bis zu "+GRACE_DAYS+" Tage weiter."],
   nocrypto:["Dieser Browser wird nicht unterstützt.","Bitte Chrome, Edge oder Safari in aktueller Version verwenden und die Seite über eine https-Adresse öffnen."],
   fehler:["Die App konnte nicht geladen werden.","Bitte Seite neu laden oder bei der Fa. PREISFLIEGER melden."]}[kind];
  $("lock").hidden=false; $("lkMsg").textContent=T[0]; $("lkExtra").textContent=(msg?msg+" ":"")+T[1];
  $("lkForm").hidden=!(kind==="enter"||kind==="invalid"||kind==="gesperrt"||kind==="abgelaufen"); $("lkSave").hidden=false;
}
function exportData(){
  let pr=[],tp=[]; try{ pr=JSON.parse(localStorage.getItem("baustahlliste.projekte.v1")||"[]"); }catch(e){} try{ tp=JSON.parse(localStorage.getItem("baustahlliste.vorlagen.v1")||"[]"); }catch(e){}
  pr=pr.filter(p=>p&&!p.sample);
  if(!pr.length&&!tp.length){ alert("Es sind keine eigenen Daten zum Sichern vorhanden."); return; }
  const blob=new Blob([JSON.stringify({format:"baustahlliste-sicherung",version:1,created:new Date().toISOString(),projects:pr,templates:tp},null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="STAHLFLIEGER-Sicherung "+today()+".json"; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
}
async function fetchStatus(){ const r=await fetch(STATUS_URL+(STATUS_URL.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"}); if(!r.ok) throw new Error("http"); return r.json(); }
async function evaluate(status,key){
  const k=norm(key), id=k.slice(0,6), w=k.slice(6);
  if(status.an===false) return {bad:"off",msg:status.msg};
  const entry=status.kunden&&status.kunden[id];
  if(!entry) return {bad:k.length<10?"invalid":"gesperrt",msg:status.msg};
  let info; try{ info=JSON.parse(await aesOpen(await deriveKey(w,id),entry)); }catch(e){ return {bad:"invalid"}; }
  if(info.bis<today()) return {bad:"abgelaufen",msg:status.msg,info};
  return {info,status};
}
async function start(){
  if(!(window.crypto&&crypto.subtle)) return lock("nocrypto");
  const lic=lsGet(LSK); if(!lic||!lic.key) return lock("enter");
  let status=null;
  try{ status=await fetchStatus(); lsSet(LSC,{ts:Date.now(),status}); }
  catch(e){ const c=lsGet(LSC); if(c&&Date.now()-c.ts<GRACE_DAYS*864e5) status=c.status; else return lock("offline"); }
  const r=await evaluate(status,lic.key);
  if(r.bad) return lock(r.bad,r.msg,r.info);
  let pay; try{ const ck=await crypto.subtle.importKey("raw",b64d(JSON.parse(await aesOpen(await deriveKey(norm(lic.key).slice(6),norm(lic.key).slice(0,6)),status.kunden[norm(lic.key).slice(0,6)])).ck),"AES-GCM",false,["decrypt"]); pay=JSON.parse(await aesOpen(ck,PAYLOAD)); }
  catch(e){ return lock("fehler"); }
  window.__LIZ={name:r.info.name,bis:r.info.bis,art:r.info.art||"test",msg:status.msg||""};
  $("lock").remove();
  const st=document.createElement("style"); st.textContent=pay.css; document.head.appendChild(st);
  document.body.insertAdjacentHTML("beforeend",pay.html);
  const sc=document.createElement("script"); sc.textContent=pay.js; document.body.appendChild(sc);
  setInterval(async()=>{ try{ const s=await fetchStatus(); lsSet(LSC,{ts:Date.now(),status:s}); const x=await evaluate(s,lic.key); if(x.bad) location.reload(); }catch(e){} },6*3600*1000);
}
$("lkGo").onclick=()=>{ const k=norm($("lkKey").value); if(k.length<20){ lock("invalid"); return; } lsSet(LSK,{key:k}); location.reload(); };
$("lkKey").addEventListener("keydown",e=>{ if(e.key==="Enter") $("lkGo").click(); });
$("lkSave").onclick=exportData;
$("lkPrice").onclick=()=>PF.prices(); $("lkInst").onclick=()=>PF.install();
start().catch(()=>lock("fehler"));
})();
